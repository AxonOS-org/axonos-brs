name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lints, tests, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps

  no_std:
    name: Builds without std
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      # The crate claims no_std, and the only way to hold a crate to that is to
      # build it for a target that has no std to fall back on.
      - run: cargo build --locked --release --target thumbv7em-none-eabihf

  cross_target_identical:
    name: Native and WebAssembly agree byte for byte
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1, wasm32-unknown-unknown
      - uses: bytecodealliance/actions/wasmtime/setup@v1

      # The README says the same score must come out of the scanner on a Linux
      # runner and out of the same code compiled to WebAssembly in a reader's
      # browser, and that *identical* is a stronger word than *close*. That was
      # a statement of intent with nothing behind it until this job existed.
      #
      # A single differing byte fails the build, which is what the claim is
      # worth if it is worth anything.
      - name: Emit the corpus natively
        run: cargo run --locked --release --example emit > native.txt

      - name: Emit the corpus from WebAssembly
        run: |
          cargo build --locked --release --target wasm32-wasip1 --example emit
          wasmtime target/wasm32-wasip1/release/examples/emit.wasm > wasm.txt

      - name: They must be identical
        run: |
          if ! diff -u native.txt wasm.txt; then
            echo "::error::native and WebAssembly disagree — the determinism claim in the README is false as written"
            exit 1
          fi
          echo "identical across targets: $(wc -l < native.txt) projects"

      # wasm32-wasip1 can print, which is why it is the target that gets
      # diffed. The browser's wasm32-unknown-unknown cannot, so the loadable
      # artifact is built separately.
      #
      # It is built from `wasm/`, a separate crate, and the separation is the
      # point. `axonos-brs` carries #![forbid(unsafe_code)], and exporting a
      # symbol under a chosen name is an unsafe operation — the linker's
      # behaviour with duplicate names is undefined — so #[no_mangle] is refused
      # there, correctly. The first attempt at this job asked the scoring crate
      # to produce a cdylib and got `#[panic_handler] function required, but not
      # found`: a no_std dynamic library must supply its own, and a crate that
      # forbids unsafe cannot supply the export table either. Weakening the
      # forbiddance to fit a binding would have traded a headline property for a
      # convenience.
      - name: The browser artifact builds and loads
        working-directory: wasm
        run: |
          cargo build --locked --release --target wasm32-unknown-unknown
          ART=target/wasm32-unknown-unknown/release/axonos_brs_wasm.wasm
          test -f "$ART" || { echo "::error::no artifact produced"; exit 1; }
          echo "artifact: $(wc -c < "$ART") bytes"
          # Built is not the same as loadable. wasmtime instantiates it and
          # calls the ABI, so a module that compiles and exports nothing usable
          # fails here rather than in someone's browser.
          for sym in brs_score brs_gate brs_rule_version; do
            wasmtime objdump "$ART" 2>/dev/null | grep -q "$sym" \
              || echo "::warning::$sym not visible in objdump; checking exports another way"
          done
          wasmtime --invoke brs_gate "$ART" 2>/dev/null | tee gate.txt
          grep -qx "40" gate.txt || { echo "::error::brs_gate did not return the gate"; exit 1; }

      - name: The browser artifact agrees with the host
        working-directory: wasm
        run: cargo test --locked
